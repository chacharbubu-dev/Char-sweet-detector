<script>

// 🌟 แก้ไข: เปลี่ยนชื่อตัวแปรเพื่อไม่ให้ชนกับระบบอื่น (แก้บั๊ก Identifier 'URL' has already been declared)
const tmModelURL = "https://teachablemachine.withgoogle.com/models/N55-y6r3T/";

let model;
let maxPredictions;
let labelContainer;

let video;
let stream;

let predicting = false;
let currentFacingMode = "user";

const cooldown = {};

let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

let modelLoaded = false;

/* ------------------ */
/* Flower Animation   */
/* ------------------ */

setInterval(() => {
    const flower = document.createElement("div");
    flower.className = "petal";
    flower.innerHTML = "🌸";
    flower.style.left = Math.random() * 100 + "vw";
    flower.style.fontSize = (15 + Math.random() * 20) + "px";
    flower.style.animationDuration = (5 + Math.random() * 5) + "s";
    document.body.appendChild(flower);

    setTimeout(() => {
        flower.remove();
    }, 10000);
}, 500);

/* ------------------ */
/* Load Page          */
/* ------------------ */

window.onload = async () => {
    try {
        loadHistory();
        await setupCamera();
        await loadModel();
        console.log("Sweet AI Ready");
    } catch (error) {
        console.error(error);
        alert("เกิดข้อผิดพลาดในการโหลดระบบ");
    }
};

/* ------------------ */
/* Camera             */
/* ------------------ */

async function setupCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: currentFacingMode,
                width: { ideal: 320 },
                height: { ideal: 320 }
            },
            audio: false
        });

        video = document.getElementById("webcam");
        
        // 🌟 แก้ไข: เช็กความปลอดภัยถ้าไม่มีแท็กวีดีโอ จะได้ไม่พ่น Error
        if (!video) {
            console.warn("ไม่พบ Element id='webcam' บนหน้าเว็บของคุณ");
            return;
        }

        video.srcObject = stream;
        await video.play();
        console.log("CAMERA READY");
    } catch (err) {
        console.error("ไม่สามารถเข้าถึงกล้องได้:", err);
    }
}

/* ------------------ */
/* Switch Camera      */
/* ------------------ */

async function switchCamera() {
    const wasRunning = predicting;
    predicting = false;
    currentFacingMode = currentFacingMode === "user" ? "environment" : "user";

    await setupCamera();

    if (wasRunning) {
        predicting = true;
        predictLoop();
    }
}

/* ------------------ */
/* Load Model         */
/* ------------------ */

async function loadModel() {
    // 🌟 แก้ไข: เรียกใช้ตัวแปรใหม่ที่เปลี่ยนชื่อแล้ว
    const modelURL = tmModelURL + "model.json";
    const metadataURL = tmModelURL + "metadata.json";

    if (typeof tmImage === "undefined") {
        console.error("ไม่พบ Library ของ Teachable Machine กรุณาเช็กว่าใส่สคริปต์ใน <head> ครบไหม");
        return;
    }

    model = await tmImage.load(modelURL, metadataURL);
    console.log("MODEL LOADED");
    modelLoaded = true;

    maxPredictions = model.getTotalClasses();
    labelContainer = document.getElementById("label-container");

    if (!labelContainer) {
        console.warn("ไม่พบ Element id='label-container'");
        return;
    }

    labelContainer.innerHTML = "";
    for (let i = 0; i < maxPredictions; i++) {
        const div = document.createElement("div");
        div.className = "prediction";
        labelContainer.appendChild(div);
    }
}

/* ------------------ */
/* Start Stop         */
/* ------------------ */

function startPredict() {
    if (!modelLoaded) {
        alert("กำลังโหลดโมเดล...");
        return;
    }

    if (!predicting) {
        predicting = true;
        predictLoop();
    }
}

function stopPredict() {
    predicting = false;
}

/* ------------------ */
/* Predict Loop       */
/* ------------------ */

async function predictLoop() {
    if (!predicting) return;
    await predict();
    setTimeout(predictLoop, 100);
}

/* ------------------ */
/* Predict            */
/* ------------------ */

async function predict() {
    if (!model || !video || !video.srcObject) return;

    const prediction = await model.predict(video);
    let highest = prediction[0];

    for (let i = 0; i < prediction.length; i++) {
        const p = prediction[i];

        // 🌟 แก้ไข: เช็กความปลอดภัยก่อนแสดงเปอร์เซ็นต์
        if (labelContainer && labelContainer.childNodes[i]) {
            labelContainer.childNodes[i].innerHTML = `${p.className} : ${(p.probability * 100).toFixed(1)}%`;
        }

        if (p.probability > highest.probability) {
            highest = p;
        }
    }

    if (highest.probability > 0.80) {
        const now = Date.now();
        if (!cooldown[highest.className] || now - cooldown[highest.className] > 10000) {
            cooldown[highest.className] = now;
            beep();
            saveHistory(highest.className);
        }
    }
}

/* ------------------ */
/* Beep Sound         */
/* ------------------ */

function beep() {
    try {
        if (audioCtx.state === 'suspended') {
