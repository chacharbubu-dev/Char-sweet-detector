<script>

const URL =
"https://teachablemachine.withgoogle.com/models/N55-y6r3T/";

let model;
let maxPredictions;
let labelContainer;

let video;
let stream;

let predicting = false;
let currentFacingMode = "user";

const cooldown = {};

let audioCtx =
new(window.AudioContext ||
window.webkitAudioContext)();

let modelLoaded = false;

/* ------------------ */
/* Flower Animation   */
/* ------------------ */

setInterval(()=>{

const flower =
document.createElement("div");

flower.className = "petal";
flower.innerHTML = "🌸";

flower.style.left =
Math.random()*100+"vw";

flower.style.fontSize =
(15+Math.random()*20)+"px";

flower.style.animationDuration =
(5+Math.random()*5)+"s";

document.body.appendChild(flower);

setTimeout(()=>{
flower.remove();
},10000);

},500);

/* ------------------ */
/* Load Page          */
/* ------------------ */

window.onload = async()=>{

await tf.setBackend("webgl");
await tf.ready();

console.log(
"TensorFlow Backend:",
tf.getBackend()
);

loadHistory();

await setupCamera();

await loadModel();

};

/* ------------------ */
/* Camera             */
/* ------------------ */

async function setupCamera(){

if(stream){

stream.getTracks().forEach(
track=>track.stop()
);

}

stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:currentFacingMode,
width:{ideal:224},
height:{ideal:224}
}

});

video =
document.getElementById(
"webcam"
);

video.srcObject =
stream;

await video.play();

}

async function switchCamera(){

const wasRunning =
predicting;

predicting = false;

currentFacingMode =

currentFacingMode === "user"

? "environment"

: "user";

await setupCamera();

if(wasRunning){

predicting = true;

predictLoop();

}

}

/* ------------------ */
/* Load Model         */
/* ------------------ */

async function loadModel(){

const modelURL =
URL + "model.json";

const metadataURL =
URL + "metadata.json";

model =
await tmImage.load(
modelURL,
metadataURL
);

modelLoaded = true;

maxPredictions =
model.getTotalClasses();

labelContainer =
document.getElementById(
"label-container"
);

labelContainer.innerHTML = "";

for(
let i=0;
i<maxPredictions;
i++
){

const div =
document.createElement(
"div"
);

div.className =
"prediction";

labelContainer
.appendChild(div);

}

}

/* ------------------ */
/* Start / Stop       */
/* ------------------ */

function startPredict(){

if(!modelLoaded){

alert(
"กำลังโหลดโมเดล..."
);

return;

}

if(!predicting){

predicting = true;

predictLoop();

}

}

function stopPredict(){

predicting = false;

}

/* ------------------ */
/* Predict Loop       */
/* ------------------ */

async function predictLoop(){

if(!predicting)
return;

await predict();

setTimeout(
predictLoop,
80
);

}

/* ------------------ */
/* Predict            */
/* ------------------ */

async function predict(){

const prediction =
await model.predict(
video
);

let highest =
prediction[0];

for(
let i=0;
i<prediction.length;
i++
){

const p =
prediction[i];

labelContainer
.childNodes[i]
.innerHTML =

`${p.className}
:
${(p.probability*100)
.toFixed(1)}%`;

if(
p.probability >
highest.probability
){
highest = p;
}

}

if(
highest.probability > 0.80
){

const now =
Date.now();

if(

!cooldown[
highest.className
]

||

now -
cooldown[
highest.className
]

>

10000

){

cooldown[
highest.className
] = now;

beep();

saveHistory(
highest.className
);

}

}

}

/* ------------------ */
/* Beep Sound         */
/* ------------------ */

function beep(){

const osc =
audioCtx
.createOscillator();

const gain =
audioCtx
.createGain();

osc.type =
"sine";

osc.frequency.value =
1200;

gain.gain.value =
0.08;

osc.connect(
gain
);

gain.connect(
audioCtx.destination
);

osc.start();

setTimeout(()=>{

osc.stop();

},100);

}

/* ------------------ */
/* Save History       */
/* ------------------ */

function saveHistory(
className
){

const canvas =
document.createElement(
"canvas"
);

canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;

const ctx =
canvas.getContext(
"2d"
);

ctx.drawImage(
video,
0,
0
);

const image =
canvas.toDataURL(
"image/png"
);

const time =
new Date()
.toLocaleString(
"th-TH"
);

const history =
document.getElementById(
"history"
);

const card =
document.createElement(
"div"
);

card.className =
"history-card";

card.innerHTML =

`
<img src="${image}">
<div class="class-title">
${className}
</div>
<div class="time">
${time}
</div>
`;

history.prepend(card);

localStorage.setItem(
"historyData",
history.innerHTML
);

}

/* ------------------ */
/* Load History       */
/* ------------------ */

function loadHistory(){

const data =
localStorage.getItem(
"historyData"
);

if(data){

document
.getElementById(
"history"
)
.innerHTML =
data;

}

}

/* ------------------ */
/* Clear History      */
/* ------------------ */

function clearHistory(){

localStorage.removeItem(
"historyData"
);

document
.getElementById(
"history"
)
.innerHTML = "";

}

</script>
